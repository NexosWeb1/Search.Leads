# Configuracao de deploy no Netlify.
#
# O plugin oficial do Next cuida do roteamento, das rotas de API como funcoes e
# do proxy como Edge Function. Nao ha nada a configurar alem disto.
#
# ATENCAO a string de conexao: DATABASE_URL precisa ser a do POOLER DE TRANSACAO
# do Supabase (porta 6543), e nao a conexao direta (5432). Funcao serverless abre
# muitas conexoes curtas, e a conexao direta esgota o limite do banco.
# Veja a secao "Hospedar no Netlify" no README.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "24"

  # O Netlify varre o resultado do build atras de valores de variaveis de
  # ambiente e reprova o deploy se encontrar algum. As duas variaveis com
  # prefixo NEXT_PUBLIC sao embutidas no JavaScript que vai para o navegador,
  # por definicao: e assim que a tela de login fala com o Supabase. Sem esta
  # excecao o build falha com "secrets detected in build output", que soa como
  # vazamento mas e o comportamento esperado.
  #
  # Nada de sigiloso entra aqui. A chave anonima do Supabase e publica por
  # natureza; quem protege os dados e a sessao, nao o segredo dela. A chave do
  # Google e a string do banco NAO estao nesta lista e continuam sendo varridas.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"

  # O cache de compilacao do Turbopack fica fora da varredura.
  #
  # O Next resolve referencias a process.env durante o build, e o Turbopack
  # guarda o resultado dessa compilacao em cache para as proximas execucoes. A
  # chave do Google acaba dentro desses arquivos .sst, e a varredura acusa como
  # se fosse vazamento.
  #
  # Nao e. Cache de build nao vai para o ar: o plugin do Next monta o deploy a
  # partir da saida, nao do cache, e este caminho fica de fora do publicado. A
  # varredura continua valendo para todo o resto, inclusive para o codigo do
  # servidor e para os arquivos que o navegador baixa.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**"

# A varredura de um raio grande passa facil de 30 segundos. O limite padrao de
# funcao no Netlify e 10s no plano gratuito e 26s nos pagos; o teto de
# requisicoes por busca ja mantem a varredura curta, mas vale saber que raio
# muito grande pode estourar o tempo em producao mesmo assim.
[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # A plataforma nao deve ser indexada: e ferramenta interna, e a tela de login
    # aparecendo em busca so atrai tentativa de acesso.
    X-Robots-Tag = "noindex, nofollow"
