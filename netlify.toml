# Configuracao de deploy no Netlify.
#
# O plugin oficial do Next cuida do roteamento, das rotas de API como funcoes e
# do proxy como Edge Function. Nao ha nada a configurar alem disto.
#
# ATENCAO a string de conexao: DATABASE_URL precisa ser a do POOLER DE TRANSACAO
# do Supabase (porta 6543), e nao a conexao direta (5432). Funcao serverless abre
# muitas conexoes curtas, e a conexao direta esgota o limite do banco.
# Veja a secao "Hospedar no Netlify" no README.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "24"

# A varredura de um raio grande passa facil de 30 segundos. O limite padrao de
# funcao no Netlify e 10s no plano gratuito e 26s nos pagos; o teto de
# requisicoes por busca ja mantem a varredura curta, mas vale saber que raio
# muito grande pode estourar o tempo em producao mesmo assim.
[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # A plataforma nao deve ser indexada: e ferramenta interna, e a tela de login
    # aparecendo em busca so atrai tentativa de acesso.
    X-Robots-Tag = "noindex, nofollow"
